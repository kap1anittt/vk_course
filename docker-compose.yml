name: lakehouse

services:
  minio:
    image: chainguard/minio:latest
    container_name: lakehouse-minio
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == *200* ]]"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: chainguard/minio-client:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: "http://minioadmin:minioadmin123@minio:9000"
    command: ["mb", "--ignore-existing", "local/lakehouse"]

  postgres:
    image: postgres:16
    container_name: lakehouse-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lakekeeper
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lakekeeper"]
      interval: 3s
      timeout: 5s
      retries: 20

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest
    container_name: lakekeeper-migrate
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: "This-is-a-local-lab-key"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://postgres:postgres@postgres:5432/lakekeeper"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://postgres:postgres@postgres:5432/lakekeeper"
      LAKEKEEPER__BASE_URI: "http://lakekeeper:8181"
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest
    container_name: lakekeeper
    environment: *lakekeeper-env
    command: ["serve"]
    ports:
      - "8181:8181"
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  lakekeeper-init:
    image: curlimages/curl:latest
    container_name: lakekeeper-init
    depends_on:
      - lakekeeper
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "waiting for lakekeeper..."
        until curl -s -o /dev/null http://lakekeeper:8181/health; do sleep 2; done
        echo "--- bootstrap ---"
        curl -s -X POST http://lakekeeper:8181/management/v1/bootstrap \
          -H 'Content-Type: application/json' \
          -d '{"accept-terms-of-use": true}'
        echo
        echo "--- create warehouse ---"
        curl -s -X POST http://lakekeeper:8181/management/v1/warehouse \
          -H 'Content-Type: application/json' \
          -d '{
            "warehouse-name": "lakehouse",
            "storage-profile": {
              "type": "s3",
              "bucket": "lakehouse",
              "key-prefix": "warehouse",
              "endpoint": "http://minio:9000",
              "region": "us-east-1",
              "path-style-access": true,
              "flavor": "minio",
              "sts-enabled": false
            },
            "storage-credential": {
              "type": "s3",
              "credential-type": "access-key",
              "aws-access-key-id": "minioadmin",
              "aws-secret-access-key": "minioadmin123"
            }
          }'
        echo
        echo "init done"

  trino:
    image: trinodb/trino:476
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./sql:/sql
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully

volumes:
  minio-data:
  pg-data:
